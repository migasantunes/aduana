# Example aduana configuration.
#
# This file is validated with `extra="forbid"`: an unknown key is an error, not a warning.
# Verify it loads with:
#   uv run python -c "from aduana.config import load_config; print(load_config('aduana.example.yaml'))"
#
# The upstreams below point at the lab servers (lab/servers/*) on ports 9101-9105, so this
# config drives the whole demo. Targets MCP revision 2026-07-28.

gateway:
  host: 127.0.0.1          # bind loopback only; the CLI may override host/port
  port: 8700
  path: /mcp               # the one POST endpoint agents talk to
  # Exact Origin values allowed (DNS-rebinding defence). Requests with no Origin
  # (non-browser clients) are accepted; any other Origin gets 403.
  allowed_origins:
    - http://127.0.0.1:8700
  max_body_bytes: 1048576  # 1 MiB cap on a single JSON-RPC request body
  upstream_timeout_s: 30.0
  max_list_ttl_ms: 60000   # upper bound on the ttlMs advertised for aggregated lists

# Operator-chosen upstream names become the prefix agents see: `<name>__<tool>`.
# serverInfo.name is self-reported and never used for namespacing.
upstreams:
  - name: notes
    url: http://127.0.0.1:9101/mcp
  - name: weather
    url: http://127.0.0.1:9102/mcp
  - name: calc
    url: http://127.0.0.1:9103/mcp
  - name: search
    url: http://127.0.0.1:9104/mcp
  - name: export
    url: http://127.0.0.1:9105/mcp
    # Static headers are this upstream's own credentials. The agent's Authorization
    # header is never forwarded; set upstream credentials here instead.
    headers:
      X-Lab-Note: synthetic-upstream

# Default-deny: a call is refused unless a rule allows it. First matching rule wins;
# patterns are shell-style globs over subject, upstream and tool.
policy:
  default: deny
  rules:
    # The benign notes server's read-only tools are allowed for everyone.
    - effect: allow
      subjects: ["*"]
      upstream: notes
      tools: ["list_notes", "read_note"]

    # Adding a note is allowed, but only when the arguments satisfy this schema:
    # a short id and a bounded body. Arguments that fail the schema are denied.
    - effect: allow
      subjects: ["*"]
      upstream: notes
      tools: ["add_note"]
      arguments:
        type: object
        properties:
          id:
            type: string
            maxLength: 64
          text:
            type: string
            maxLength: 4096
        required: ["id", "text"]
        additionalProperties: false

    # Weather and search lookups are allowed for everyone (detectors still inspect
    # their definitions and results).
    - effect: allow
      subjects: ["*"]
      upstream: weather
      tools: ["get_weather"]
    - effect: allow
      subjects: ["*"]
      upstream: search
      tools: ["search", "search_stream"]

    # Everything else (notably export) falls through to the default: deny.

# Pin tool definitions against a lockfile. `enforce` drops unknown or changed
# definitions from the exposed catalog; `warn` records drift but still exposes them.
pinning:
  mode: warn
  lockfile: aduana.lock

# Rule-based detectors. A finding at or above `deny_at` denies the message.
detectors:
  rules:
    enabled: true
    deny_at: high
  secrets:
    enabled: true
    deny_at: high

# Audit log. Omit `path` (or set it null) to write JSONL to stderr.
audit:
  path: audit.jsonl
